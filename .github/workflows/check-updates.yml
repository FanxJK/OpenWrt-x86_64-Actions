name: Update Checker

env:
  REPO_NAME: immortalwrt/immortalwrt
  BUILD_VER: "25.12"

on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:

    - name: Check Updates
      run: |
        CURRENT_TAG=$(curl -fsL -H "Authorization: Bearer ${{ secrets.MY_SECRETS_TOKEN }}" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" | awk -F '"' '/tag_name/{print $4}')
        REPO_TAG=$(curl -fsL -H "Authorization: Bearer ${{ secrets.MY_SECRETS_TOKEN }}" "https://api.github.com/repos/$REPO_NAME/tags?per_page=100" | awk -F '"' '/name/{print $4}' | grep "^v$BUILD_VER" | head -n 1)
        [ -n "$CURRENT_TAG" ] && [ -n "$REPO_TAG" ] || { echo "::error::Unable to resolve the current or upstream release tag."; exit 1; }
        CURRENT_VER=${CURRENT_TAG%-????.??.??}
        echo "Current Version: $CURRENT_VER"
        echo "Repo Version: $REPO_TAG"
        echo "REPO_TAG=$REPO_TAG" >> "$GITHUB_ENV"
        if [ "$CURRENT_VER" != "$REPO_TAG" ]; then
          echo "Found Updates, Start Build..."
          echo "HAS_UPDATE=true" >> "$GITHUB_ENV"
        else
          echo "No Updates"
          echo "HAS_UPDATE=false" >> "$GITHUB_ENV"
        fi

    - name: Trigger build
      if: env.HAS_UPDATE == 'true'
      uses: peter-evans/repository-dispatch@main
      with:
        token: ${{ github.token }}
        event-type: Source Code Update
        client-payload: '{"clean_cache": "true","upload_release": "true"}'

    - name: Keep cache alive
      id: keep-cache
      if: env.HAS_UPDATE == 'false'
      uses: actions/cache/restore@main
      with:
        path: |
          openwrt/staging_dir/host*
          openwrt/staging_dir/tool*
          openwrt/.ccache
          openwrt/tmp/go-build
          openwrt/build_dir/hostpkg
        key: openwrt-${{ runner.os }}-${{ runner.arch }}-${{ env.REPO_TAG }}_keepalive
        restore-keys: |
          openwrt-${{ runner.os }}-${{ runner.arch }}-${{ env.REPO_TAG }}_

    - name: Check cache keepalive result
      if: env.HAS_UPDATE == 'false'
      env:
        MATCHED_KEY: ${{ steps.keep-cache.outputs.cache-matched-key }}
      run: |
        if [ -n "$MATCHED_KEY" ]; then
          echo "Cache kept alive: $MATCHED_KEY"
        else
          echo "::warning::No cache found for $REPO_TAG. A successful build is required to create it."
        fi

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ github.token }}
        retain_days: 1
        keep_minimum_runs: 3
