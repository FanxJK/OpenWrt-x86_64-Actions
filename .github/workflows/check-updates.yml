name: Update Checker

env:
  REPO_NAME: immortalwrt/immortalwrt
  BUILD_VER: "25.12"

on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:

    - name: Check Updates
      run: |
        CURRENT_TAG=$(
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" |
          awk -F '"' '/"tag_name":/ { print $4; exit }'
        )
        REPO_TAG=$(
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            "https://api.github.com/repos/$REPO_NAME/tags?per_page=100" |
          awk -F '"' -v version="$BUILD_VER" \
            '/"name":/ && index($4, "v" version) == 1 { print $4; exit }'
        )
        if [ -z "$CURRENT_TAG" ] || [ -z "$REPO_TAG" ]; then
          echo "::error::Unable to resolve the current or upstream release tag."
          exit 1
        fi
        if [[ "$CURRENT_TAG" == *rc* ]]; then
          CURRENT_VER=$(echo "$CURRENT_TAG" | awk -F'-' '{print $1 "-" $2}')
        else
          CURRENT_VER=$(echo "$CURRENT_TAG" | awk -F'-' '{print $1}')
        fi
        echo "Current Version: $CURRENT_VER"
        echo "Repo Version: $REPO_TAG"
        echo "CURRENT_VER=$CURRENT_VER" >> "$GITHUB_ENV"
        echo "REPO_TAG=$REPO_TAG" >> "$GITHUB_ENV"
        if [ "$CURRENT_VER" != "$REPO_TAG" ]; then
          echo "Found Updates, Start Build..."
          echo "HAS_UPDATE=true" >> "$GITHUB_ENV"
        else
          echo "No Updates"
          echo "HAS_UPDATE=false" >> "$GITHUB_ENV"
        fi

    - name: Trigger build
      if: ${{ env.HAS_UPDATE == 'true' }}
      uses: peter-evans/repository-dispatch@main
      with:
        token: ${{ github.token }}
        event-type: Source Code Update
        client-payload: '{"clean_cache": "true","upload_release": "true"}'

    - name: Setup workspace for cache
      if: ${{ env.HAS_UPDATE == 'false' }}
      env:
        REPO_TAG: ${{ env.REPO_TAG }}
      run: |
        sudo mkdir -p /workdir
        sudo chown "$USER:$(id -gn)" /workdir
        REPO_URL="https://github.com/$REPO_NAME.git"
        git clone --depth=1 --branch "$REPO_TAG" --single-branch "$REPO_URL" /workdir/openwrt
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

    - name: Keep cache alive
      if: ${{ env.HAS_UPDATE == 'false' }}
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        prefix: ${{ github.workspace }}/openwrt
        clean: 'false'
        skip_saving: 'true'

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ github.token }}
        retain_days: 1
        keep_minimum_runs: 3
